<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PontaAI</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
header{
  background:#1e293b;
  padding:16px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
#chat{
  height:70vh;
  overflow:auto;
  padding:16px;
}
.msg{
  margin:12px 0;
  padding:12px;
  border-radius:12px;
}
.user{
  background:#2563eb;
}
.ai{
  background:#334155;
}
footer{
  display:flex;
  gap:8px;
  padding:12px;
}
input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
}
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<header>PontaAI 🤖</header>

<div id="chat"></div>

<footer>
<input id="message" placeholder="メッセージを入力">
<button onclick="send()">送信</button>
</footer>

<script>
   const chat = document.getElementById("chat");

function add(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

async function send(){

  const input=document.getElementById("message");
  const text=input.value.trim();

  if(!text)return;

  add(text,"user");
  input.value="";

  add("考え中...","ai");

  const loading=chat.lastChild;

  try{

    const res=await fetch("https://hidden-lake-a315.jiatenghuangji9.workers.dev",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text
      })
    });

    const data=await res.json();

    let reply="返答を取得できませんでした";

    if(data.candidates){
      reply=data.candidates[0].content.parts[0].text;
    }

    loading.textContent=reply;

  }catch(e){

    loading.textContent="エラー："+e.message;

  }

}
 </script>

</body>
</html>
