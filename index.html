<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponta AI</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
}
header{
    background:#1f2937;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}
#chat{
    height:70vh;
    padding:15px;
    overflow-y:auto;
}
.message{
    background:#374151;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}
footer{
    display:flex;
    padding:10px;
    background:#1f2937;
}
input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
}
button{
    margin-left:10px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
}
</style>
</head>
<body>

<header>Ponta AI</header>

<div id="chat">
    <div class="message">こんにちは！Ponta AIへようこそ！</div>
</div>

<footer>
    <input id="text" placeholder="メッセージを入力">
    <button onclick="send()">送信</button>
</footer>

<script>
function send(){
    let input=document.getElementById("text");
    let chat=document.getElementById("chat");

    if(input.value==="") return;

    chat.innerHTML += `<div class="message"><b>あなた:</b> ${input.value}</div>`;
    chat.innerHTML += `<div class="message"><b>Ponta AI:</b> まだ開発中です😊</div>`;

    input.value="";
    chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
